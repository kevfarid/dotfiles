set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

set -g mouse on
set -g default-terminal "screen-256color"

# Explicit prefix-table bindings used by Ghostty key forwarding.
bind-key -T prefix c new-window
bind-key -T prefix n next-window
bind-key -T prefix p previous-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'vaaleyard/tmux-dotbar'

# Rose Pine palette (matches ghostty + nvim)
set -g @tmux-dotbar-bg "#0b0a10"
set -g @tmux-dotbar-fg "#6e6a86"
set -g @tmux-dotbar-fg-current "#e0def4"
set -g @tmux-dotbar-fg-session "#908caa"
set -g @tmux-dotbar-fg-prefix "#eb6f92"

run '~/.config/tmux/plugins/tpm/tpm'
