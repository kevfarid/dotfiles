# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                                   TMUX                                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Linked to ~/.config/tmux. Plugins live in ./plugins (gitignored, managed by tpm).

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"

# ── Base ──────────────────────────────────────────────────────────────────────
set -g default-shell /opt/homebrew/bin/fish
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on
set -g escape-time 10
set -g history-limit 50000
set -g status-position bottom

# Explicit prefix-table bindings used by Ghostty key forwarding.
bind-key -T prefix c new-window -c "#{pane_current_path}"
bind-key -T prefix n next-window
bind-key -T prefix p previous-window

# Splits open in the current directory
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'janoamaral/tokyo-night-tmux'   # layout; colors overridden below
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save / C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + auto-restore
set -g @plugin 'tmux-plugins/tmux-yank'        # copy-mode y -> macOS clipboard
set -g @plugin 'omerxx/tmux-sessionx'          # prefix o -> fzf session picker
set -g @plugin 'tmux-plugins/tmux-cpu'         # CPU / RAM in the bar (battery: tokyo widget)

# tokyo-night-tmux (Rosé Pine colors: themes/tokyo-night-rosepine.sh)
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_prefix_active_color "#eb6f92"
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_path_format relative
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_battery_low_threshold 21
set -g @tokyo-night-tmux_show_datetime 1
set -g @tokyo-night-tmux_date_format DMY
set -g @tokyo-night-tmux_time_format 24H

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# sessionx
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

# tmux-cpu colors (Rosé Pine)
set -g @cpu_low_fg_color "#[fg=#9ccfd8]"
set -g @cpu_medium_fg_color "#[fg=#f6c177]"
set -g @cpu_high_fg_color "#[fg=#eb6f92]"
set -g @ram_low_fg_color "#[fg=#c4a7e7]"
set -g @ram_medium_fg_color "#[fg=#f6c177]"
set -g @ram_high_fg_color "#[fg=#eb6f92]"

run '~/.config/tmux/plugins/tpm/tpm'

# Re-apply tokyo-night with Rosé Pine, then let tmux-cpu fill in its placeholders.
run '/opt/homebrew/bin/bash ~/.config/tmux/scripts/tokyo-night-rosepine.sh'
run '~/.config/tmux/plugins/tmux-cpu/cpu.tmux'

# tmux-fingers (Homebrew binary): prefix F -> hint & copy URLs, paths, hashes
run 'tmux-fingers load-config'
